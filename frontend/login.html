<!doctype html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вхід</title>
    <link rel="stylesheet" href="styles/css/main.css">
</head>
<body>
    <div class="app-container">
        <header class="site-header">
            <nav class="main-nav" aria-label="Головна навігація">
                <ul class="nav-list">
                    <li><a href="index.html" class="nav-link">Головна</a></li>
                    <li><a href="register.html" class="nav-link">Реєстрація</a></li>
                </ul>
            </nav>
        </header>

        <div class="content-wrapper">
            <main class="main-content">
                <section class="auth-wrapper">
                    <article class="auth-card">
                        <h1 class="auth-header">З поверненням</h1>

                        <form action="/authenticate" method="post" class="booking-form-vertical">
                            <div class="form-group">
                                <label for="login-email" class="form-label">Ел. пошта</label>
                                <input type="email" id="login-email" name="email" class="input-field" required placeholder="user@example.com">
                            </div>

                            <div class="form-group">
                                <label for="login-password" class="form-label">Пароль</label>
                                <input type="password" id="login-password" name="password" class="input-field" required placeholder="********">
                            </div>

                            <div class="auth-actions">
                                <a href="index.html" class="btn-cancel">Скасувати</a>
                                <button type="submit" class="btn-submit">Увійти</button>
                            </div>
                        </form>
                    </article>
                </section>
            </main>
        </div>

        <footer class="site-footer">
            <p class="footer-text">© 2026 Театральний застосунок. Усі права захищено.</p>
        </footer>
    </div>
</body>
</html>
